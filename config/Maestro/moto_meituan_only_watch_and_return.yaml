appId: com.sankuai.meituan
---
- repeat:
      times: 500
      commands:
          - tapOn:
                text: ".*去完成.*"
                index: ${buttonIndex || 0 }
                optional: true
          - tapOn:
                text: ".*[点击并浏览|立即购买|打开一淘].*"
                optional: true
          - runFlow:
                file: ./common/flow_common_25s_and_return_app.yaml
                env:
                    appId: "com.sankuai.meituan"
                    step: 1
                    needReturn: "true"
          - tapOn:
                id: "button_001"
                optional: true

          - repeat:
                while:
                    notVisible:
                        text: ".*赚钱中心.*"
                commands:
                    - back

          # - runFlow:
          #       when:
          #           notVisible:
          #               text: ".*赚钱中心.*"
          #       commands:
          #           - back
