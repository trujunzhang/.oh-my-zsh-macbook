appId: com.sankuai.meituan
---
- repeat:
      times: 500
      commands:
          - runFlow:
                when:
                    visible:
                        text: ".*赚钱中心.*"
                commands:
                    - tapOn:
                          text: ".*看视频开广告.*"
                          optional: true
          - runFlow:
                when:
                    visible:
                        text: ".*赚钱中心.*"
                commands:
                    - tapOn:
                          text: ".*浏览优质视频.*"
                          optional: true
          - runFlow:
                when:
                    visible:
                        text: ".*赚钱中心.*"
                commands:
                    - tapOn:
                          text: ".*逛精选好物.*"
                          optional: true
          - runFlow:
                when:
                    visible:
                        text: ".*赚钱中心.*"
                commands:
                    - tapOn:
                          text: ".*浏览好物得金币.*"
                          optional: true
          - runFlow:
                when:
                    visible:
                        text: ".*赚钱中心.*"
                commands:
                    - tapOn:
                          text: ".*点击立即得金币.*"
                          optional: true
          - runFlow:
                when:
                    visible:
                        text: ".*赚钱中心.*"
                commands:
                    - tapOn:
                          text: ".*看广告赚金币.*"
                          optional: true

          - runFlow:
                when:
                    visible:
                        text: ".*提现.*" # 提现页面
                commands:
                    - back

          - tapOn:
                # text: ".*[点击并浏览|立即购买|打开一淘|立即下载].*"
                text: ".*[点击并浏览|立即购买|打开一淘].*"
                optional: true
          - runFlow:
                file: ./common/flow_common_25s_and_return_app.yaml
                env:
                    appId: "com.sankuai.meituan"
                    step: 3
                    needReturn: "true"
          - tapOn:
                id: "button_001"
                optional: true

          - repeat:
                while:
                    notVisible:
                        text: ".*赚钱中心.*"
                commands:
                    - back

                    - tapOn:
                          text: ".*残忍离开.*"
                          optional: true

          - tapOn:
                text: ".*[立即领奖].*"
                optional: true
