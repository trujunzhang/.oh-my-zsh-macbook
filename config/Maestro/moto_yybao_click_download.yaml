appId: com.tencent.android.qqdownloader
---
- repeat:
      times: 10
      commands:
          - tapOn:
                text: "下载"
                optional: true
          - runFlow:
                file: ./common/flow_moto_install_app.yaml
          - runFlow:
                file: ./yybao/flow_goto_browser.yaml
          - runFlow:
                file: ./yybao/flow_click_lingjifen.yaml
