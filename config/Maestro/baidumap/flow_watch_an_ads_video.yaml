appId: com.baidu.BaiduMap
---
- repeat:
      times: 1

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 20
                repeat: 20
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 800

- runFlow:
      when:
          visible:
              # text: ".*点击跳转拿奖励.*"
              text: ".*点击.*拿奖励.*"
      commands:
          - tapOn:
                # text: "点击跳转拿奖励"
                text: ".*点击.*拿奖励.*"
                optional: true

- repeat:
      times: 2

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 20
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 3800

# Step 5: Return to App
- launchApp:
      stopApp: false # Brings the app back to the foreground without restarting it

- back
- runFlow:
      when:
          visible:
              text: ".*真的不再看看了吗.*"
      commands:
          - tapOn:
                text: "残忍离开"
                optional: true

- repeat:
      times: 1

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 20
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 3800

- runFlow:
      when:
          notVisible:
              text: ".*今日打卡任务.*"
      commands:
          - back
