appId: com.qiyi.video.lite
---
- runFlow:
      when:
          visible:
              text: "上滑继续观看"
      commands:
          - evalScript: ${output.shouldClickButton = true}

- runFlow:
      when:
          true: ${output.shouldClickButton == true}
      commands:
          - tapOn:
                text: "立即领取"
                optional: true

          # - tapOn:
          #       text: "立即打开"
          #       optional: true
          #
          # - tapOn:
          #       text: "查看详情"
          #       optional: true

- repeat:
      times: 3

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 200
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 38000

# Step 5: Return to App
- launchApp:
      stopApp: false # Brings the app back to the foreground without restarting it

