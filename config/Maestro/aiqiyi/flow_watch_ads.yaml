appId: com.qiyi.video.lite
---
- extendedWaitUntil:
      notVisible:
          text: ".*已领取.*"
      timeout: 30000

- extendedWaitUntil:
      visible:
          text: ".*上滑继续观看.*"
      timeout: 30000

- runFlow:
      when:
          visible:
              text: ".*上滑继续观看.*"
      commands:
          - tapOn:
                # text: ".*立即领取.*"
                # text: ".*可提现.*"
                # text: ".*提现.*"
                text: ".*兑会员.*"
                optional: true

- repeat:
      times: 3

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 200
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 38000

# Step 5: Return to App
- launchApp:
      stopApp: false # Brings the app back to the foreground without restarting it

