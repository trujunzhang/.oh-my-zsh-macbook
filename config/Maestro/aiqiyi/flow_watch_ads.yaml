appId: com.qiyi.video.lite
---
- extendedWaitUntil:
      notVisible:
          text: ".*已领取.*"
      timeout: 30000

- extendedWaitUntil:
      visible:
          text: ".*上滑继续观看.*"
      timeout: 30000

- runFlow:
      when:
          visible:
              text: ".*上滑继续观看.*"
      commands:
          - tapOn:
                # text: ".*立即领取.*"
                # text: ".*可提现.*"
                # text: ".*提现.*"
                text: ".*兑会员.*"
                optional: true

- runFlow:
      when:
          notVisible:
              text: ".*上滑继续观看.*"
      commands:
          - runFlow:
                file: ../common/flow_common_25s_and_return_app.yaml
                env:
                    appId: "com.qiyi.video.lite"
                    needReturn: true
