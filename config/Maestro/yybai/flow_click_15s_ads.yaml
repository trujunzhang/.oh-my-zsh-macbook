appId: com.tencent.android.qqdownloader
---
- extendedWaitUntil:
      notVisible:
          # text: "点击后, 看15秒可获得奖励"
          # text: ".*秒可获得奖励"
          text: ".*秒可得奖励"
      timeout: 20000

- runFlow:
      when:
          visible:
              # text: "点击后, 看15秒可获得奖励"
              # text: ".*秒可获得奖励"
              text: ".*秒可得奖励"
      commands:
          - tapOn:
                text: "了解详情"

- repeat:
      times: 3

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 200
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 38000

# Step 5: Return to App
- launchApp:
      stopApp: false # Brings the app back to the foreground without restarting it

