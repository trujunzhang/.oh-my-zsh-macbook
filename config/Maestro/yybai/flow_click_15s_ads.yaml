appId: com.tencent.android.qqdownloader
---
- repeat:
      times: 2

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 200
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 38000

- tapOn:
      point: "600, 1940" # 点击"立即下载"按钮

- repeat:
      times: 3

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 200
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 38000

# Step 5: Return to App
- launchApp:
      stopApp: false # Brings the app back to the foreground without restarting it

- back

- tapOn:
      point: "1020, 245" # 点击"x" close按钮

- repeat:
      times: 2

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 200
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 38000
