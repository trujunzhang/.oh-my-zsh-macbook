appId: com.follow.clashxxx
---
- runFlow:
      when:
          visible:
              text: "Continue installation"
      commands:
          - tapOn:
                text: "Continue installation"

- runFlow:
      when:
          visible:
              text: "I understand the risk.*"
      commands:
          - tapOn:
                text: "I understand the risk.*"
          - tapOn:
                text: "Continue installation"

- extendedWaitUntil:
      notVisible:
          text: ".*Installing.*"
      timeout: 500000

- extendedWaitUntil:
      notVisible:
          text: ".*Installing.*"
      timeout: 500000

- repeat:
      while:
          notVisible:
              text: ".*Installation successful.*"
      commands:
          - back

- runFlow:
      when:
          visible:
              text: "Installation successful"
      commands:
          - tapOn:
                text: "DONE"
