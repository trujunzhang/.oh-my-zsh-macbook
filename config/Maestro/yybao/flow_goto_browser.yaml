appId: com.tencent.android.qqdownloader
---
- tapOn:
      id: "button_001"
      optional: true
      delay: 200
      repeat: 200
      retryTapIfNoChange: true
      waitToSettleTimeoutMs: 38000

- tapOn:
      point: "600, 1365" # 点击"去浏览"按钮

- runFlow:
      file: ../common/flow_common_25s_and_return_app.yaml
      env:
          appId: "com.tencent.android.qqdownloader"
          needReturn: "true"
