appId: com.tencent.android.qqdownloader
---
- repeat:
      times: 1

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 300
                # repeat: 1000
                retryTapIfNoChange: true
                # waitToSettleTimeoutMs: 38000

- tapOn:
      point: "600, 1780" # 点击"立即下载"按钮
      # point: "600, 1800" # 点击"立即下载"按钮

- tapOn:
      point: "600, 1940" # 点击"立即下载"按钮

- runFlow:
      file: ../common/flow_common_25s_and_return_app.yaml
      env:
          appId: "com.tencent.android.qqdownloader"
          step: 2
          needReturn: "true"
          returnStep: 2

- back

- tapOn:
      point: "1020, 245" # 点击"x" close按钮

- runFlow:
      when:
          visible:
          notVisible:
              text: ".*我的.*"
      commands:
          - tapOn:
                point: "1005, 210" # 点击"x" close按钮

          - tapOn:
                point: "552, 1432" # 点击"坚持退出"按钮
                # text: ".*坚持退出.*"
                optional: true

- runFlow:
      when:
          true: ${needWait || 'true' == "true"}
      commands:
          - repeat:
                times: 2

                commands:
                    - tapOn:
                          id: "button_001"
                          optional: true
                          delay: 200
                          repeat: 200
                          retryTapIfNoChange: true
                          waitToSettleTimeoutMs: 38000
