- tapOn:
      text: "去完成"
      optional: true

- tapOn:
      id: "button_001"
      optional: true
      delay: 200
      repeat: 200
      retryTapIfNoChange: true
      waitToSettleTimeoutMs: 3800

- runFlow:
      when:
          notVisible:
              text: ".*做任务领金币.*"
      commands:
          - back

- repeat:
      times: 4

      commands:
          - tapOn:
                id: "button_001"
                optional: true
                delay: 200
                repeat: 20
                retryTapIfNoChange: true
                waitToSettleTimeoutMs: 3800

# Step 5: Return to App
- launchApp:
      stopApp: false # Brings the app back to the foreground without restarting it

- tapOn:
      id: "button_001"
      optional: true
      delay: 200
      repeat: 200
      retryTapIfNoChange: true
      waitToSettleTimeoutMs: 3800

