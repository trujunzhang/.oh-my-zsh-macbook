appId: com.sankuai.meituan
---
- repeat:
      while:
          notVisible:
              text: "浏览视频任务已全部完成"
      commands:
          - runFlow:
                when:
                    visible:
                        # text: "上滑继续看视频"
                        text: ".*查看详情 立领.*"
                commands:
                    - tapOn:
                          text: "查看详情 立领.*金币"
                          optional: true
                    - back

          - swipe:
                direction: UP
                waitToSettleTimeoutMs: 500

          - runFlow:
                file: ./common/flow_common_25s_and_return_app.yaml
                env:
                    appId: "com.sankuai.meituan"
                    needReturn: false
                    step: 2

