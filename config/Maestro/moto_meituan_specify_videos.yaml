appId: com.sankuai.meituan
---
- repeat:
      while:
          notVisible:
              text: "浏览视频任务已全部完成"
      commands:
          - runFlow:
                when:
                    visible:
                        # text: "上滑继续看视频"
                        text: ".*查看详情 立领.*"
                commands:
                    - tapOn:
                          text: "查看详情 立领.*金币"
                          optional: true
                    - back

          - swipe:
                direction: UP
                waitToSettleTimeoutMs: 500

          - tapOn:
                text: "点击查看详情"
                optional: true

          - repeat:
                times: 3

                commands:
                    - tapOn:
                          id: "button_001"
                          optional: true
                          delay: 200
                          repeat: 200
                          retryTapIfNoChange: true
                          waitToSettleTimeoutMs: 38000

                    - doubleTapOn:
                          id: "button_002"
                          optional: true
                          delay: 200
                          repeat: 200
                          retryTapIfNoChange: true
                          waitToSettleTimeoutMs: 38000
